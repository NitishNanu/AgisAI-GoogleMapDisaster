[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aegisai-backend"
version = "1.0.0"
description = "AegisAI — AI-Powered Disaster Response & Emergency Management Platform"
requires-python = ">=3.10"
dependencies = [
    # Web Framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Database
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2>=0.15.0",
    "alembic>=1.13.1",

    # Async
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",

    # Pydantic & Settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pydantic[email]>=2.7.0",
    "email-validator>=2.1.1",

    # Security & Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",

    # Messaging
    "aio-pika>=9.4.1",

    # Scheduler
    "apscheduler>=3.10.4",

    # Logging
    "structlog>=24.1.0",

    # Redis
    "redis>=5.0.4",

    # Geospatial
    "shapely>=2.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "types-passlib>=1.7.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",    # Line length (handled by formatter)
    "B008",    # Do not perform function calls in argument defaults (FastAPI Depends)
    "B904",    # Within except clause, raise ... from err (FastAPI pattern)
    "B905",    # zip without strict
    "F403",    # Star imports in legacy __init__.py
    "F405",    # Star imports in legacy __init__.py
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S", "T20", "E402", "B017", "F841"]
"alembic/**/*.py" = ["ANN", "E402"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
exclude = [
    "alembic/",
    "tests/",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "-v",
    "--tb=short",
]
markers = [
    "unit: Unit tests — no DB required",
    "integration: Integration tests requiring live services",
    "slow: Long-running simulation tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/core/database/seed.py",
    "alembic/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
